name: Gestor de Impressoras

on:
  workflow_dispatch:
  push:
    tags:
      - 'gestor-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            comando: npm run dist:linux
          - os: windows-latest
            comando: npm run dist:windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gestor-impressora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestor-impressora/package-lock.json
      - name: Instalar dependencias
        id: instalar
        continue-on-error: true
        run: npm ci
      - name: Repetir instalacao apos falha de rede
        if: steps.instalar.outcome == 'failure'
        run: npm ci
      - run: ${{ matrix.comando }}
      - uses: actions/upload-artifact@v4
        with:
          name: gestor-${{ runner.os }}
          path: gestor-impressora/release/SimplesX-Gestor-*

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestor-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK Android
        run: gradle :app:assembleDebug
      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SimplesX-Gestor-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gestor-Android
          path: gestor-android/SimplesX-Gestor-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artefatos/*
