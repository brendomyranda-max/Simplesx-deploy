name: Servidor DoixP

on:
  workflow_dispatch:
  push:
    tags:
      - 'gestor-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            comando: npm run dist:linux
          - os: windows-latest
            comando: npm run dist:windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gestor-impressora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestor-impressora/package-lock.json
      - name: Instalar dependencias
        id: instalar
        continue-on-error: true
        run: npm ci
      - name: Repetir instalacao apos falha de rede
        if: steps.instalar.outcome == 'failure'
        run: npm ci
      - name: Testar protocolos e sintaxe
        run: npm test
      - run: ${{ matrix.comando }}
      - uses: actions/upload-artifact@v4
        with:
          name: servidor-doixp-${{ runner.os }}
          path: |
            gestor-impressora/release/servidor-doixp-*
            gestor-impressora/release/latest*.yml
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestor-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar assinatura permanente do Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/simplexsa-release.jks"
      - name: Compilar APK Android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/simplexsa-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease
      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk servidor-doixp-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: servidor-doixp-Android
          path: gestor-android/servidor-doixp-android.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - name: Validar instaladores e preparar manifesto Android
        run: node scripts/gestor-release.mjs artefatos
      - uses: softprops/action-gh-release@v2
        with:
          files: artefatos/*
          make_latest: false
          body: |
            Servidor DoixP 1.5.16 para Windows, Linux e Android.

            - Botão Buscar atualizações, download e instalação sem desinstalar o servidor.
            - Preserva pareamento, configurações e histórico de impressão.
            - Android: leitura pelo UID do cartão NTAG215, diagnóstico NFC e retomada do leitor ao voltar das configurações.
            - Abrir DoixP e usar cartões NFC: atendimento dentro do servidor Android, sem trocar de app e pausar o leitor.
            - Termina trabalhos recebidos antes de instalar uma atualização.

            Para passar de uma versão antiga para esta, execute o instalador por cima da instalação atual. No Android, confirme Atualizar. As próximas versões poderão ser buscadas pelo novo botão.
# Testa e publica os instaladores Android, Linux e Windows do Servidor DoixP.
