name: Servidor DoixP

on:
  workflow_dispatch:
  push:
    tags:
      - 'gestor-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            comando: npm run dist:linux
          - os: windows-latest
            comando: npm run dist:windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gestor-impressora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestor-impressora/package-lock.json
      - name: Instalar dependencias
        id: instalar
        continue-on-error: true
        run: npm ci
      - name: Repetir instalacao apos falha de rede
        if: steps.instalar.outcome == 'failure'
        run: npm ci
      - name: Testar protocolos e sintaxe
        run: npm test
      - name: Compilar instalador (assinar Windows quando certificado estiver configurado)
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ] && [ -n "$CSC_LINK" ]; then
            ${{ matrix.comando }} -- --config.forceCodeSigning=true
          else
            ${{ matrix.comando }}
          fi
      - name: Verificar assinatura Windows quando configurada
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        shell: pwsh
        run: |
          if ($env:CSC_LINK) {
            $signature = Get-AuthenticodeSignature release/servidor-doixp-windows-x64.exe
            if ($signature.Status -ne 'Valid') { throw 'Assinatura Windows inválida' }
          } else {
            Write-Warning 'Certificado Windows não configurado: este instalador pode exibir aviso de editor desconhecido.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: servidor-doixp-${{ runner.os }}
          path: |
            gestor-impressora/release/servidor-doixp-*
            gestor-impressora/release/latest*.yml
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestor-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar assinatura permanente do Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/simplexsa-release.jks"
      - name: Compilar APK Android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/simplexsa-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease
      - name: Verificar APK e continuidade da assinatura oficial
        shell: bash
        run: |
          set -euo pipefail
          verifier=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$verifier" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/new-apk-signature.txt"
          previous=$(node --input-type=module -e "import { GESTOR_RELEASE } from '../shared/gestor-releases.js'; console.log(GESTOR_RELEASE + 'servidor-doixp-android.apk')")
          curl --fail --location --retry 3 "$previous" -o "$RUNNER_TEMP/previous.apk"
          "$verifier" verify --print-certs "$RUNNER_TEMP/previous.apk" > "$RUNNER_TEMP/previous-apk-signature.txt"
          diff <(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/previous-apk-signature.txt") <(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/new-apk-signature.txt")
      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk servidor-doixp-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: servidor-doixp-Android
          path: gestor-android/servidor-doixp-android.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true
      - name: Validar instaladores e preparar manifesto Android
        run: node scripts/gestor-release.mjs artefatos
      - uses: softprops/action-gh-release@v2
        with:
          files: artefatos/*
          make_latest: false
          body: |
            Servidor DoixP 1.5.23 para Windows, Linux e Android.

            - USB OTG com blocos menores, escritas parciais e seleção da interface de impressora.
            - Guilhotina e avanço mínimo por impressora em mobile e desktop.
            - Corte nativo e avanço otimizado opcional para Diebold IM453H PD1.12+.
            - Opções de mídia e altura de etiquetas padronizadas.
            - Consulta de atualização ao abrir, instalação pelo próprio servidor e configurações preservadas.
            - APK verificado com a mesma assinatura da versão oficial anterior e checksums públicos.

            No S21, selecione USB, autorize a impressora e confira o protocolo no autoteste. Use DIEBOLD para IM453H Padrão/Padrão II. O resultado físico depende do modelo e firmware.

            O Android exige confirmação da instalação. Sem certificado de código Windows, o instalador ainda pode apresentar aviso de editor desconhecido. A assinatura não elimina automaticamente avisos de reputação.
# Testa e publica os instaladores Android, Linux e Windows do Servidor DoixP.
